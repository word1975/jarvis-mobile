name: jarvis_mobile
description: "Jarvis 手机端远程控制App — 通过互联网或局域网远程连接电脑，支持实时聊天、文件传输、远程截屏、系统监控等功能"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.0
  http: ^1.2.0
  file_picker: ^8.0.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
